[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carelink-ai"
version = "0.1.0"
description = "CareLink server-side AI service."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.11.4",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
]

[tool.setuptools.packages.find]
# Discover the top-level 'ai' package from the directory that contains it.
# When installed from the repo root, `import ai` works everywhere.
where = [".."]
include = ["ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
